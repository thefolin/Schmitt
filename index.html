<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Schmitt Odyssée - Vue Caméra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="game-area-fullscreen">
            <!-- Zone du plateau avec caméra (plein écran) -->
            <div id="boardCamera" class="board-camera-container">
                <!-- Les dés seront créés ici dynamiquement -->
            </div>

            <!-- Bandeau du joueur courant : qui joue, et ce qu'on attend de lui -->
            <div class="turn-banner" id="currentPlayerIndicator">
                <span class="turn-dot" id="currentPlayerDot"></span>
                <span class="turn-text">
                    <span class="turn-name" id="currentPlayerName">Joueur 1</span>
                    <span class="turn-hint" id="currentPlayerHint">À vous de jouer</span>
                </span>
            </div>

            <!-- Barre d'action : le lancer de dé est le cœur du jeu, il occupe
                 la place principale. Le reste vit dans le tiroir « ⋯ ». -->
            <div class="action-bar">
                <button class="roll-btn" id="rollDiceBtn">
                    <span class="roll-btn-icon" aria-hidden="true">⚄</span>
                    <span class="roll-btn-label">Lancer le dé</span>
                </button>
                <button class="more-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false"
                    aria-controls="actionDrawer" title="Autres actions">
                    <span aria-hidden="true">⋯</span>
                </button>
            </div>

            <!-- Tiroir des actions secondaires -->
            <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
            <div class="action-drawer" id="actionDrawer" role="dialog" aria-label="Autres actions" hidden>
                <div class="drawer-handle" aria-hidden="true"></div>

                <div class="drawer-section">
                    <span class="drawer-legend">Déplacement</span>
                    <button class="drawer-item" id="manualMoveBtn">
                        <span class="drawer-icon" aria-hidden="true">🎯</span>
                        <span class="drawer-label">Déplacement manuel</span>
                    </button>
                </div>

                <div class="drawer-section">
                    <span class="drawer-legend">Vue</span>
                    <div class="drawer-row">
                        <button class="drawer-chip camera-control-btn" data-action="zoom-in" title="Zoom avant">+</button>
                        <button class="drawer-chip camera-control-btn" data-action="zoom-out" title="Zoom arrière">−</button>
                        <button class="drawer-chip camera-control-btn" data-action="focus-dice" title="Voir le dé">⚄</button>
                        <button class="drawer-chip camera-control-btn" data-action="reset" title="Recentrer">⌂</button>
                    </div>
                </div>

                <!-- Historique : rempli et basculé en JS depuis le tiroir -->
                <div class="drawer-history" id="historyPanel" hidden>
                    <span class="drawer-legend">Historique</span>
                    <ul class="history-list" id="historyList"></ul>
                </div>

                <div class="drawer-section">
                    <span class="drawer-legend">Partie</span>
                    <button class="drawer-item" id="showHistoryBtn">
                        <span class="drawer-icon" aria-hidden="true">📜</span>
                        <span class="drawer-label">Historique</span>
                    </button>
                    <a class="drawer-item" href="/index-editor.html">
                        <span class="drawer-icon" aria-hidden="true">✏️</span>
                        <span class="drawer-label">Éditeur de plateau</span>
                    </a>
                    <button class="drawer-item drawer-item--danger" id="resetBtn">
                        <span class="drawer-icon" aria-hidden="true">🔄</span>
                        <span class="drawer-label">Nouvelle partie</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Modal info joueur (slide up) -->
        <div class="player-modal" id="playerModal">
            <div class="player-modal-content">
                <div class="modal-header">
                    <h3 id="modalPlayerName">Joueur</h3>
                    <button class="close-modal-btn" id="closePlayerModal">×</button>
                </div>
                <div class="modal-body">
                    <div class="player-stats">
                        <div class="stat-item">
                            <span class="stat-icon">📍</span>
                            <span class="stat-label">Position</span>
                            <span class="stat-value" id="modalPlayerPosition">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-icon">🍺</span>
                            <span class="stat-label">Gorgées</span>
                            <span class="stat-value" id="modalPlayerDrinks">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-icon">⚡</span>
                            <span class="stat-label">Pouvoir</span>
                            <span class="stat-value" id="modalPlayerPower">Non</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Menu principal : une rampe de lancement, pas un formulaire.
         Tout ce qui n'est pas « ajouter des joueurs » ou « jouer » vit dans
         le panneau Plateau & outils, replié par défaut. -->
    <div class="setup-screen" id="setupScreen">
        <div class="setup-panel">
            <h2>Schmitt Odyssée</h2>

            <div class="players-section">
                <div class="players-head">
                    <span class="players-legend">Joueurs</span>
                    <span class="players-count" id="playerCountLabel">2 / 10</span>
                </div>

                <div class="player-inputs" id="playerInputs"></div>

                <button type="button" class="add-player-btn" id="addPlayerBtn">
                    <span class="add-player-plus">+</span> Ajouter un joueur
                </button>
            </div>

            <button class="btn btn-primary" id="startGameBtn">Jouer</button>

            <!-- Réglages avancés : repliés, pour ne pas encombrer le chemin vers « Jouer » -->
            <details class="tools-panel" id="toolsPanel">
                <summary class="tools-summary">
                    <span class="tools-summary-label">Plateau &amp; outils</span>
                    <span class="tools-summary-value" id="currentBoardLabel">Plateau par défaut</span>
                    <span class="tools-chevron" aria-hidden="true"></span>
                </summary>

                <div class="tools-body">
                    <label class="tools-label" for="mapSelect">Plateau de jeu</label>
                    <select id="mapSelect" class="ds-field">
                        <option value="default">Plateau par défaut</option>
                    </select>

                    <div class="setup-actions">
                        <button type="button" class="ds-btn" id="importMapBtn">Importer JSON</button>
                        <a href="/index-editor.html" class="ds-btn ds-btn--bronze">Éditeur</a>
                    </div>
                </div>
            </details>
        </div>
    </div>

    <!-- Modal d'effets -->
    <div class="modal" id="effectModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="tile-effect-icon" id="effectIcon"></div>
            <h2 id="effectTitle"></h2>
            <p id="effectDescription"></p>
            <div id="effectInteraction"></div>
            <div class="modal-actions">
                <button class="btn btn-primary" id="effectOkBtn">OK</button>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <!-- Écran de victoire -->
    <div class="victory-screen" id="victoryScreen">
        <div class="victory-content">
            <h1>🎉 VICTOIRE ! 🎉</h1>
            <div class="winner-name" id="winnerName"></div>
            <div class="stats-grid" id="statsGrid"></div>
            <button class="btn btn-primary" onclick="location.reload()"
                style="margin-top: 20px; font-size: 1.2em;">Nouvelle partie</button>
        </div>
    </div>

    <!-- Script TypeScript (Vite le transformera automatiquement) -->
    <script type="module" src="/src/camera/main-camera.ts"></script>
</body>

</html>
