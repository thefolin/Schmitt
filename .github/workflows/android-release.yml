name: Release Android

# Publie une release GitHub avec l'APK téléchargeable.
#
# Le workflow « Build Android APK/AAB » produit un artifact, qui expire et
# n'est visible que depuis l'onglet Actions. Celui-ci crée une vraie release :
# un lien stable, partageable à la communauté.
#
# Deux façons de le lancer :
#   - pousser un tag `v*`      → version tirée du tag (ex : v1.2.0)
#   - depuis l'onglet Actions  → saisir la version à la main

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex : 1.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Marquer comme préversion (jeu en développement)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Déterminer la version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version : $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      # Une release ne doit pas partir si le jeu est cassé : les tests sont
      # rapides (moins de 3 s) et couvrent les règles du jeu.
      - name: Vérifier les types
        run: npm run type-check

      - name: Lancer les tests
        run: npm test

      - name: Build web assets
        run: |
          export CAPACITOR_PLATFORM=true
          npm run build

      # L'APK OUVRE LA SCÈNE 3D, et non le rendu CSS.
      #
      # Capacitor n'expose aucune « page d'entrée » : il sert `webDir` et
      # ouvre le fichier nommé `index.html`. Or tout ce qu'il y a à tester
      # sur téléphone vit dans `index-3d.html` — mode cinéma, secousse,
      # colonnes des dieux, tracé du plateau, contrôles de caméra. Un APK
      # ouvrant `index.html` n'en montrerait rien.
      #
      # La bascule se fait ICI plutôt que dans le dépôt : le site garde son
      # accueil CSS, et seul l'APK change de page. Le rendu CSS reste
      # d'ailleurs embarqué, sous son nom d'origine.
      #
      # À RETIRER le jour où la refonte fusionne dans `main` : `index.html`
      # portera alors la scène 3D, et cette étape n'aura plus lieu d'être.
      - name: Ouvrir la scène 3D dans l'APK
        run: |
          cd dist
          mv index.html index-css.html
          mv index-3d.html index.html
          ls -la *.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Sync Capacitor
        run: npx cap sync android

      # versionCode doit croître à chaque publication, sinon le Play Store
      # refuse la mise à jour. Le numéro de run fait un compteur simple et
      # toujours croissant.
      - name: Fixer la version dans le build Android
        run: |
          cd android/app
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.version.outputs.version }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Construire l'APK signé
        # --stacktrace : sans lui, un échec Gradle ne dit pas grand-chose, et
        # les logs d'un dépôt privé ne sont pas lisibles sans authentification.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            # Chemin ABSOLU : Gradle résout `store.file` depuis android/app/,
            # pas depuis android/ où le fichier vient d'être écrit.
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            echo "SIGNED=oui" >> $GITHUB_ENV
          else
            # Sans secret configuré, on génère une clé de DÉBOGAGE à la volée :
            # un APK non signé ne s'installe tout simplement pas, et livrer un
            # fichier inutilisable n'aide personne. Cette clé change à chaque
            # build, elle ne convient donc qu'aux tests — pour le Play Store,
            # ou pour que les mises à jour s'installent par-dessus, il faut
            # une vraie clé stable dans les secrets (voir le README).
            echo "::warning::Aucun keystore dans les secrets — signature de test générée à la volée"
            keytool -genkeypair -v \
              -keystore test.keystore \
              -alias schmitt-test \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass schmitt-test -keypass schmitt-test \
              -dname "CN=Schmitt Odyssee Test, OU=Dev, O=Schmitt, L=Paris, C=FR"
            ls -la test.keystore
            ./gradlew assembleRelease --stacktrace \
              -Pandroid.injected.signing.store.file="$PWD/test.keystore" \
              -Pandroid.injected.signing.store.password=schmitt-test \
              -Pandroid.injected.signing.key.alias=schmitt-test \
              -Pandroid.injected.signing.key.password=schmitt-test
            echo "SIGNED=test" >> $GITHUB_ENV
          fi

      - name: Renommer l'APK
        run: |
          cd android/app/build/outputs/apk/release
          ls -la
          APK=$(ls *.apk | head -1)
          mv "$APK" "schmitt-odyssee-${{ steps.version.outputs.version }}.apk"
          ls -la

      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Schmitt Odyssée ${{ steps.version.outputs.version }}
          # Le jeu est en développement et ses droits d'assets ne sont pas
          # encore réglés : préversion par défaut.
          prerelease: ${{ github.event.inputs.prerelease != 'false' }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/*.apk
          body: |
            ## 🎲 Schmitt Odyssée ${{ steps.version.outputs.version }}

            **APK Android** — téléchargez le fichier `.apk` ci-dessous.

            ### Installation

            1. Téléchargez l'APK sur votre téléphone
            2. Autorisez l'installation depuis des sources inconnues
            3. Ouvrez le fichier téléchargé

            ### Bon à savoir

            - Le jeu se joue de préférence **en paysage** (tournez l'écran)
            - De 2 à 10 joueurs
            - APK signé : `${{ env.SIGNED }}`
              (`test` = clé de débogage générée au build : installable, mais
              une mise à jour ne s'installera pas par-dessus. Android peut
              demander d'autoriser l'installation.)

            ⚠️ **Version de développement.** Les droits de la police Gelio et
            des illustrations ne sont pas encore réglés : usage privé
            uniquement (voir le README).

      - name: Résumé
        run: |
          echo "## 🎲 Release publiée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version** : ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **versionCode** : ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK signé** : ${{ env.SIGNED }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Voir la release](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }})" >> $GITHUB_STEP_SUMMARY
