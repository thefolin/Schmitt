<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Schmitt Odyssée — aperçu 3D</title>
    <style>
        /* Aperçu volontairement dépouillé : il sert à juger le PLATEAU,
           son cadrage et sa lisibilité. Le HUD du jeu viendra plus tard. */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #0d1524;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: #e8edf9;
        }

        /* Le canvas occupe tout l'écran ; le bandeau se superpose, comme le
           fera le vrai HUD. */
        #scene {
            position: fixed;
            inset: 0;
            touch-action: none;
            cursor: grab;
        }

        #scene:active { cursor: grabbing; }
        #scene canvas { display: block; }

        .bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top, 0px));
            background: rgba(13, 21, 36, 0.82);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        #status {
            display: block;
            font-size: 13px;
            line-height: 1.3;
            color: #aab6d0;
        }

        /* Le geste ne se devine pas : on le dit une fois, discrètement. */
        #hint {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            color: #6b7896;
        }

        button {
            flex: 0 0 auto;
            min-height: 40px;
            padding: 0 14px;
            font: inherit;
            font-size: 13px;
            color: #e8edf9;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            cursor: pointer;
        }

        button:hover { border-color: #d4af37; }
    </style>
</head>
<body>
    <div id="scene"></div>

    <div class="bar">
        <span>
            <span id="status">Chargement du plateau…</span>
            <span id="hint">glisser pour tourner · deux doigts pour déplacer · pincer pour zoomer</span>
        </span>
        <button id="reset" type="button">Recadrer</button>
    </div>

    <script type="module" src="/src/features/board/scene3d/preview.ts"></script>
</body>
</html>
