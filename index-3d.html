<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Schmitt Odyssée — aperçu 3D</title>
    <style>
        /* Aperçu volontairement dépouillé : il sert à juger le PLATEAU,
           son cadrage et sa lisibilité. Le HUD du jeu viendra plus tard. */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Les encoches système, reportées dans des variables pour que la
           recette puisse en simuler sur un navigateur de bureau, où
           env(safe-area-inset-*) vaut toujours zéro. */
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #0d1524;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: #e8edf9;
        }

        /* Le canvas occupe tout l'écran ; le bandeau se superpose, comme le
           fera le vrai HUD. */
        /* LA LARGEUR QUE LE PANNEAU DES DÉS LAISSE AU PLATEAU.
           Zéro quand il est fermé : le plateau occupe alors tout l'écran,
           exactement comme avant. */
        :root { --dice-panel: 0px; }

        #scene {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            /* LE CANVAS GARDE TOUTE LA LARGEUR, et c'est indispensable
               depuis que le dé se dessine DANS le panneau : un canvas
               arrêté au bord du panneau ne peut pas dessiner dedans — le
               rectangle tombait hors cadre et le second passage était
               sauté. Mesuré : panneau 290..500, canvas 0..290.

               Le plateau n'en occupe pas moins la seule partie libre : ce
               n'est plus le canvas qui le borne, mais le VIEWPORT du
               premier passage, posé sur la largeur restante. Le cadrage
               portrait est donc préservé — c'est la contrainte de
               CLAUDE.md et le défaut « 8 cases sur 23 » de TODO.md §2. */
            right: 0;
            touch-action: none;
            cursor: grab;
            transition: right 300ms cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        /* UN APPAREIL QUI REFUSE LES ANIMATIONS les refuse toutes. */
        @media (prefers-reduced-motion: reduce) {
            #scene { transition: none; }
        }

        #scene:active { cursor: grabbing; }
        #scene canvas { display: block; }

        /* MASQUER VEUT DIRE MASQUER. L'attribut `hidden` ne vaut qu'un
           `display: none` de la feuille par défaut du navigateur, et le
           `display: flex` ci-dessous l'emporte : sans cette règle, le
           bandeau restait AFFICHÉ alors que le DOM le disait caché.
           Exactement le défaut vu sur l'APK pour la modale d'action, et
           reproduit ici sans que mon test de contrat le voie — il lisait
           l'attribut, pas le style. */
        .bar[hidden] { display: none; }

        .bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            padding-top: calc(12px + var(--safe-top));
            background: rgba(13, 21, 36, 0.82);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Ce que le cadrage a mesuré : évite de refaire la soustraction de
           tête en lisant une capture d'écran. */
        #insets {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            color: #7d8aa6;
        }

        /* Le cadre de contrôle : le plateau doit être centré DANS LUI. */
        #frame { display: none; }

        .debug-outline #frame {
            display: block;
            position: fixed;
            left: 0;
            right: 0;
            z-index: 5;
            pointer-events: none;
            border: 1px dashed rgba(212, 175, 55, 0.55);
        }

        .debug-outline #frame::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            border-top: 1px dashed rgba(212, 175, 55, 0.35);
        }

        #status {
            display: block;
            font-size: 13px;
            line-height: 1.3;
            color: #aab6d0;
        }

        /* Le geste ne se devine pas : on le dit une fois, discrètement. */
        #hint {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            color: #6b7896;
        }

        button {
            flex: 0 0 auto;
            min-height: 40px;
            padding: 0 14px;
            font: inherit;
            font-size: 13px;
            color: #e8edf9;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            cursor: pointer;
        }

        button:hover { border-color: #d4af37; }


        /*
         * ÉCRAN BAS — le paysage sur téléphone, où la hauteur est la denrée
         * rare. Mesuré sur le Pixel 10 de Quentin, navigateur ouvert : 306 px
         * de haut en tout, dont 156 étaient mangés par l'ancien HUD.
         *
         * La barre flottante coûte déjà bien moins, mais en paysage chaque
         * pixel compte : les boutons se resserrent et l'historique s'ouvre
         * sur une carte plus basse.
         */
        @media (max-height: 420px) {
            .foot {
                gap: 4px;
                padding: 4px 8px;
                padding-bottom: calc(4px + var(--safe-bottom));
            }

            .foot .actions button {
                min-width: 40px;
                min-height: 40px;
                padding: 0 8px;
            }

            #whose-turn {
                padding: 2px 10px;
                font-size: 12px;
            }

            /* Le journal reste consultable, mais borné : une carte pleine
               hauteur ne laisserait rien voir du plateau derrière. */
            #journal {
                max-height: 5em;
            }

            #journal-panel {
                padding: 8px;
                padding-bottom: calc(8px + var(--safe-bottom));
            }
        }

        /*
         * LA BARRE D'ACTION, FLOTTANTE au-dessus du plateau.
         *
         * Plus de bandeau opaque collé au bord : les boutons flottent, le
         * plateau passe dessous. C'est le « style Waze » demandé par
         * Quentin — l'écran appartient à la carte, les commandes ne font que
         * s'y poser.
         */
        .foot {
            position: fixed;
            left: 0;
            /* ELLE S'ARRÊTE AU PANNEAU, comme le plateau : mesurée à 500 px
               de large alors que le plateau n'en occupait que 290, ses
               boutons de droite passaient DESSOUS et devenaient
               intouchables. */
            right: var(--dice-panel);
            bottom: 0;
            transition: right 300ms cubic-bezier(0.22, 0.61, 0.36, 1);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            padding-bottom: calc(8px + var(--safe-bottom));
            /* AUCUN FOND : c'est ce qui distingue une barre flottante d'un
               bandeau. Chaque bouton porte le sien, et le plateau reste
               visible entre eux. */
            pointer-events: none;
        }

        /* Les boutons, eux, restent cliquables : c'est le conteneur qui
           laisse passer les gestes vers le plateau. */
        .foot button,
        #whose-turn {
            pointer-events: auto;
        }

        .foot .actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /*
         * À QUI EST LA MAIN : posé sur une pastille, et non sur un bandeau.
         * Lisible au-dessus du plateau sans lui prendre une bande entière.
         */
        #whose-turn {
            padding: 4px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #e8edf9;
            background: rgba(13, 21, 36, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            backdrop-filter: blur(8px);
        }

        /* Les boutons flottants : ronds, posés sur le plateau. */
        .foot .actions button {
            min-width: 46px;
            min-height: 46px;
            padding: 0 12px;
            background: rgba(13, 21, 36, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(8px);
        }

        /* LE LANCER est l'action principale : il se distingue des réglages,
           sinon on cherche lequel des cinq boutons fait jouer. */
        .foot .actions .roll {
            padding: 0 20px;
            font-weight: 700;
            color: #1a1305;
            background: linear-gradient(180deg, #f0d787 0%, #c9a349 100%);
            border-color: #8a6d28;
        }

        .foot .actions button[aria-pressed="true"] {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.22);
        }

        /*
         * L'HISTORIQUE, derrière son bouton.
         *
         * Il occupait trois lignes en permanence pour un confort. Le plateau
         * récupère la place, et le joueur l'ouvre quand il veut savoir ce
         * qui vient de se passer.
         */
        #journal-panel {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 16px;
            padding-bottom: calc(16px + var(--safe-bottom));
            background: rgba(6, 10, 18, 0.55);
        }

        /* `hidden` NE SERT PLUS ICI : le tiroir coulisse, et un
           `display: none` empêcherait toute transition. C'est `data-open`
           qui porte l'état — et un tiroir translaté hors de l'écran
           n'intercepte aucun geste. */

        #journal-card {
            width: min(460px, 100%);
            padding: 14px 16px;
            border-radius: 18px;
            background: rgba(13, 21, 36, 0.96);
            border: 1px solid rgba(212, 175, 55, 0.4);
            backdrop-filter: blur(10px);
        }

        #journal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #d4af37;
        }

        #journal-close {
            min-width: 36px;
            min-height: 36px;
            padding: 0;
            font-size: 20px;
            line-height: 1;
        }

        /* Ce que le dernier tour a produit : c'est ce qu'on vérifie à l'œil,
           face du dé contre nombre de cases parcourues. */
        #turn-log {
            margin-top: 8px;
            font-size: 12px;
            color: #d4af37;
        }

        #progress-label {
            margin-bottom: 5px;
            font-size: 11px;
            color: #7d8aa6;
        }

        /* Le panneau de décision : il s'impose au regard sans masquer le
           plateau, puisque c'est là que le joueur cherche ses adversaires. */
        #actions-panel {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(108px + var(--safe-bottom));
            z-index: 30;
            max-width: min(460px, calc(100% - 24px));
            padding: 12px 16px;
            border-radius: 16px;
            background: rgba(13, 21, 36, 0.94);
            border: 1px solid rgba(212, 175, 55, 0.45);
            backdrop-filter: blur(10px);
        }

        .action-prompt {
            margin-bottom: 9px;
            font-size: 13px;
            text-align: center;
            color: #e8edf9;
        }

        .action-choices {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        /* Cibles tactiles de 48px, comme les cases du plateau. */
        .action-choices button {
            min-height: 44px;
            padding: 0 16px;
            font-size: 13px;
            border-width: 2px;
        }

        .action-decline {
            border-color: rgba(255, 255, 255, 0.24) !important;
            color: #aab6d0;
        }

        /* Le journal de partie : les derniers événements, le plus récent en
           haut. Borné en hauteur — sur un téléphone en paysage la place est
           comptée, et un journal sans fin pousserait le reste dehors. */
        #journal {
            margin: 0 0 6px;
            padding: 0;
            list-style: none;
            max-height: 3.4em;
            overflow: hidden;
            font-size: 11px;
            line-height: 1.55;
            color: #8d9ab5;
        }

        #journal li {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Le plus récent se détache : c'est celui qu'on cherche du regard. */
        #journal li:first-child { color: #c3cde3; }

        #progress-track {
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            width: 0;
            border-radius: 999px;
            background: #d4af37;
            transition: width 0.18s ease-out;
        }

        .actions {
            flex: 0 0 auto;
            display: flex;
            gap: 8px;
        }

        /* Les cibles tactiles font 48px : c'est le seuil qu'on impose aussi
           aux cases du plateau. */
        #prev, #next {
            min-width: 48px;
            min-height: 48px;
            font-size: 20px;
            line-height: 1;
        }
        /* LE MODE CINÉMA, pendant que le dé roule.
           Le HUD s'efface pour laisser l'écran au dé — c'est la moitié de ce
           que le mode apporte, l'autre étant le cadre resserré.

           En FONDU et non en `display: none` : faire disparaître les barres
           d'un coup ferait sauter la mise en page, et le retour serait aussi
           brutal que le départ. La transition dure le temps d'un clignement.

           `pointer-events` suit l'opacité : un bouton invisible mais encore
           cliquable est un piège, surtout au doigt. */
        body.cinema-rolling #bar,
        body.cinema-rolling .foot,
        body.cinema-rolling #actions-panel {
            opacity: 0;
            pointer-events: none;
        }

        #bar, .foot, #actions-panel {
            transition: opacity 260ms ease;
        }

        /* Le bouton dit s'il est enfoncé, et pas seulement par sa couleur :
           `aria-pressed` porte l'état pour qui ne voit pas l'écran. */
        #cinema[aria-pressed="true"] {
            background: #c9a227;
            color: #1a1a1a;
        }

        /* LE RÉSULTAT EN GROS PLAN, le temps de le lire.
           Le HUD est masqué à cet instant : sans cet affichage, la face
           lue ne serait écrite nulle part. */
        #cinema-result {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(3rem, 18vh, 8rem);
            font-weight: 700;
            color: #f5f0e6;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.85);
            pointer-events: none;
            opacity: 0;
            transition: opacity 200ms ease;
            z-index: 50;
        }

        #cinema-result.shown {
            opacity: 1;
        }


        /*
         * LE PANNEAU DES DÉS — il coulisse depuis la droite.
         *
         * Il TRANSLATE au lieu de changer de largeur : animer `width` ou
         * `right` sur le panneau relancerait une mise en page à chaque
         * image, et le téléphone d'entrée de gamme est la cible. La
         * translation est prise en charge par le compositeur.
         *
         * C'est `--dice-panel` qui pousse le plateau, et lui seul : le
         * panneau ne fait que glisser par-dessus le bord libéré.
         */
        #dice-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 45;
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: var(--dice-panel-width);
            padding: 16px;
            padding-top: calc(16px + var(--safe-top));
            padding-bottom: calc(16px + var(--safe-bottom));
            /* LE PANNEAU NE PEINT PLUS PAR-DESSUS LE DÉ.
               Il portait `rgba(13, 21, 36, 0.96)` et `blur(10px)` : une
               vitre opaque à 96 %, posée sur le canvas À L'ENDROIT MÊME où
               le dé est dessiné. Le dé était donc rendu correctement —
               mesuré à 196 de luminosité moyenne derrière la vitre — mais
               personne ne pouvait le voir. C'est le « petit flou en
               arrière-plan » que Quentin décrit : le flou, c'était le
               `backdrop-filter`.
               Le fond passe donc sur les ENFANTS du panneau (en-tête,
               résultat, bouton), qui ont besoin d'être lisibles, et le
               panneau lui-même devient une simple fenêtre. */
            background: transparent;
            border-left: 1px solid rgba(212, 175, 55, 0.4);
            transform: translateX(100%);
            transition: transform 300ms cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        #dice-panel { pointer-events: none; }

        #dice-panel[data-open="true"] {
            transform: translateX(0);
            pointer-events: auto;
        }

        @media (prefers-reduced-motion: reduce) {
            #dice-panel { transition: none; }
        }

        /* LA LARGEUR DU PANNEAU, et donc ce qu'il retire au plateau.
           Bornée en pourcentage : sur un écran étroit, une largeur fixe
           mangerait tout le plateau.

           C'EST LE RÉGLAGE À TOUCHER EN PREMIER si le plateau se retrouve
           trop à l'étroit sur le téléphone. Panneau ouvert, il lui reste
           58 % de la largeur (mesuré de 360 à 430 px). Quentin a tranché
           d'essayer le layout gauche/droite et d'itérer sur le rendu réel
           (22/10/2026), en connaissance du précédent de TODO.md §2 —
           « 8 cases visibles sur 23 ». Baisser ce 42vw rend de la place au
           plateau sans toucher au reste. */
        :root { --dice-panel-width: min(260px, 42vw); }

        /* LE CHROME PORTE SON PROPRE FOND. Le panneau est devenu une
           fenêtre transparente pour laisser voir le dé : chaque élément
           qui doit rester LISIBLE se peint donc son propre fond, au lieu
           de compter sur celui du panneau. */
        #dice-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            margin: -6px -10px 0;
            border-radius: 10px;
            background: rgba(13, 21, 36, 0.92);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #d4af37;
        }

        #dice-panel-close {
            min-width: 44px;
            min-height: 44px;
            font-size: 22px;
            line-height: 1;
            color: #e8eefc;
            background: transparent;
            border: 0;
            cursor: pointer;
        }

        /* LA FACE LUE, en grand : c'est ce qu'on vient chercher ici. */
        /* LA FENÊTRE SUR LE DÉ. Elle occupe tout le milieu du panneau et
           ne peint RIEN : c'est à travers elle qu'on voit le dé rouler. */
        #dice-panel-face {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            flex: 1 1 auto;
            min-height: 0;
            pointer-events: none;
        }

        /* LE CHIFFRE NE COUVRE PLUS LE DÉ. Il s'affichait en 86 px au
           MILIEU du panneau, c'est-à-dire sur le dé lui-même : on venait
           regarder le dé et on lisait le résultat par-dessus. Il descend
           donc au-dessus du bouton, en plus petit, avec son propre fond.
           La face reste lue sur le DÉ, qui est l'objet du panneau. */
        #dice-panel-value {
            align-self: center;
            margin-top: auto;
            padding: 2px 16px;
            border-radius: 10px;
            background: rgba(13, 21, 36, 0.92);
            font-family: 'Cinzel', Georgia, serif;
            font-size: clamp(28px, 9vw, 44px);
            font-weight: 700;
            line-height: 1.2;
            color: #f3c969;
        }

        #dice-panel-caption {
            align-self: center;
            padding: 2px 10px;
            border-radius: 8px;
            background: rgba(13, 21, 36, 0.92);
            font-size: 12px;
            letter-spacing: 0.04em;
            text-align: center;
            color: #9fb0c9;
        }

        #dice-panel-roll {
            flex: 0 0 auto;
            min-height: 52px;
        }

        /* L'ONGLET NE S'EFFACE PLUS À L'OUVERTURE : il BASCULE désormais,
           c'est donc lui qui referme. L'effacer le réduisait à 0 × 0 px —
           mesuré — et il n'y avait plus aucun moyen de refermer le panneau
           hors la croix. Il suit le panneau (voir `.edge-right` ci-dessus)
           pour rester atteignable. */


        /*
         * LES ONGLETS DE BORD — un par panneau, à l'endroit d'où il vient.
         *
         * Ils BASCULENT : le même bouton ouvre et ferme. Un bouton pour
         * ouvrir et une croix pour fermer obligeaient à viser deux cibles
         * différentes, dont une petite.
         *
         * Ils suivent leur panneau quand il coulisse, pour rester
         * atteignables au lieu de passer dessous.
         */
        .edge-tab {
            position: fixed;
            top: 50%;
            z-index: 46;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 44 px : la cible tactile confortable. En dessous, on rate. */
            width: 44px;
            min-height: 56px;
            padding: 0;
            font-size: 20px;
            line-height: 1;
            color: #e8eefc;
            background: rgba(13, 21, 36, 0.92);
            border: 1px solid rgba(212, 175, 55, 0.4);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: transform 300ms cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        .edge-left {
            left: 0;
            border-left: 0;
            border-radius: 0 14px 14px 0;
            transform: translateY(-50%);
        }

        .edge-right {
            right: 0;
            border-right: 0;
            border-radius: 14px 0 0 14px;
            transform: translateY(-50%);
        }

        /* L'ONGLET SE DÉPLACE AVEC SON PANNEAU : sans cela il resterait
           collé au bord, recouvert par le panneau ouvert. */
        body[data-dice-panel="open"] .edge-right {
            transform: translate(calc(-1 * var(--dice-panel-width)), -50%);
        }

        body[data-journal-panel="open"] .edge-left {
            transform: translate(var(--journal-panel-width), -50%);
        }

        @media (prefers-reduced-motion: reduce) {
            .edge-tab { transition: none; }
        }

        /*
         * L'HISTORIQUE — il coulisse depuis la GAUCHE.
         *
         * Il se SUPERPOSE au plateau au lieu de lui prendre sa largeur,
         * contrairement au panneau des dés : on le consulte brièvement,
         * et recadrer le plateau à chaque consultation ferait sauter
         * l'image sous les yeux du joueur.
         */
        :root { --journal-panel-width: min(300px, 78vw); }

        #journal-panel {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: auto;
            inset: auto;
            z-index: 44;
            display: flex;
            flex-direction: column;
            width: var(--journal-panel-width);
            padding: 16px;
            padding-top: calc(16px + var(--safe-top));
            padding-bottom: calc(16px + var(--safe-bottom));
            background: rgba(13, 21, 36, 0.96);
            border-right: 1px solid rgba(212, 175, 55, 0.4);
            backdrop-filter: blur(10px);
            transform: translateX(-100%);
            transition: transform 300ms cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        /* IL RESTE DANS LE FLUX quand il est fermé : `hidden` le retirerait,
           et la transition ne jouerait pas. C'est l'attribut `data-open` qui
           porte l'état, comme pour le panneau des dés. */
        /* FERMÉ, IL NE DOIT RIEN INTERCEPTER : un tiroir translaté hors de
           l'écran reste dans l'arbre, et happerait les gestes de caméra
           lancés depuis le bord gauche du plateau. */
        #journal-panel { pointer-events: none; }

        #journal-panel[data-open="true"] {
            transform: translateX(0);
            pointer-events: auto;
        }

        @media (prefers-reduced-motion: reduce) {
            #journal-panel { transition: none; }
        }

        /* La carte ne flotte plus au milieu : elle remplit le tiroir. */
        #journal-card {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
            padding: 0;
            background: transparent;
            border: 0;
            backdrop-filter: none;
        }

        /* L'historique peut être long : il défile dans le tiroir. */
        #journal {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* ── RELIER UN SECOND APPAREIL (épique 8) ─────────────────────── */

        /* LE QR RESTE SOMBRE SUR FOND BLANC, quel que soit le thème : c'est
           la seule combinaison que lisent tous les lecteurs, et un QR doré
           sur fond bleu nuit ne se scannerait pas sous l'éclairage d'une
           soirée. La marge blanche fait partie du code. */
        .link-qr {
            align-self: center;
            width: min(72vw, 300px);
            padding: 8px;
            border-radius: 12px;
            background: #ffffff;
        }

        .link-qr svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .link-camera {
            align-self: center;
            width: min(80vw, 340px);
            aspect-ratio: 1;
            object-fit: cover;
            border: 2px solid rgba(212, 175, 55, 0.6);
            border-radius: 12px;
            background: #000000;
        }

        #setup-link {
            margin-top: 10px;
        }

        /* LA MANETTE RECOUVRE TOUT, l'écran des joueurs compris (z 1000) :
           sur le téléphone qui pilote, il n'y a pas de partie à voir
           dessous — c'est le plateau qui joue. */
        .remote-screen {
            position: fixed;
            inset: 0;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
            overflow-y: auto;
            color: #f4ecd8;
            background: radial-gradient(circle at 50% 30%, #1d2b45 0%, #0d1524 70%);
        }

        .remote-status {
            margin: 0;
            font-size: 14px;
        }

        .remote-turn {
            margin: 0;
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 600;
            color: #d4af37;
        }

        .remote-face {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 140px;
            min-height: 140px;
            padding: 0 16px;
            border: 3px solid #d4af37;
            border-radius: 24px;
            font-size: clamp(48px, 18vw, 96px);
            font-weight: 700;
            background: rgba(13, 21, 36, 0.92);
        }

        /* LE BOUTON SE PREND AU POUCE : c'est tout ce que fait la manette.
           Il reprend le doré de « Jouer » par les jetons du thème : `.roll`
           et `.btn-primary` ne sont stylés que dans leur conteneur (pied du
           HUD, panneau des joueurs), et laissaient ici un bouton gris. */
        .remote-roll {
            width: min(100%, 360px);
            min-height: 64px;
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-on-gold);
            background: var(--grad-gold);
            border: 1px solid var(--gold-700);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-gold), var(--shadow-inset);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .remote-roll:active {
            transform: translateY(1px) scale(0.995);
        }

        .remote-roll:disabled {
            opacity: 0.5;
        }

        /* LA FENÊTRE DU PLATEAU, sur le téléphone : la règle à appliquer,
           et le bouton qui la valide quand elle ne demande aucun choix. */
        .remote-prompt {
            width: min(100%, 360px);
            padding: 12px 14px;
            border: 1px solid rgba(212, 175, 55, 0.6);
            border-radius: var(--radius-md);
            background: rgba(13, 21, 36, 0.92);
            text-align: center;
        }

        .remote-prompt-title {
            margin: 0 0 6px;
            font-family: var(--font-display);
            font-size: 18px;
            color: #d4af37;
        }

        .remote-prompt-lines p {
            margin: 4px 0;
            font-size: 15px;
        }

        .remote-validate {
            width: 100%;
            min-height: 52px;
            margin-top: 10px;
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-on-gold);
            background: var(--grad-gold);
            border: 1px solid var(--gold-700);
            border-radius: var(--radius-md);
            touch-action: manipulation;
        }

        .remote-validate:disabled {
            opacity: 0.5;
        }

        .remote-prompt-note {
            margin: 8px 0 0;
            font-size: 14px;
            opacity: 0.8;
        }

        .remote-log,
        .remote-players {
            width: min(100%, 360px);
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .remote-log li {
            padding: 6px 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            font-size: 15px;
        }

        .remote-log li:first-child {
            font-weight: 600;
        }

        .remote-players li {
            margin-top: 4px;
            padding: 4px 10px;
            border-left: 6px solid transparent;
            font-size: 14px;
            opacity: 0.85;
        }

    </style>
</head>
<body>
    <div id="scene"></div>

    <!-- Le jeu se joue en paysage. Plutôt que de verrouiller l'orientation,
         on le dit : le joueur garde la main, et on pourra verrouiller plus
         tard si l'usage montre que c'est nécessaire. -->
    <!-- Cadre de contrôle, visible avec ?debug=1 : le plateau doit être
         centré dans lui, et sa ligne médiane passer au milieu du plateau. -->
    <div id="frame"></div>

    <!-- La face lue, en grand, pendant que le HUD est effacé. -->
    <div id="cinema-result" aria-live="polite"></div>

    <!--
         LE BANDEAU DE DIAGNOSTIC, réservé à la RECETTE.
         Il servait à régler le cadrage : cases visibles, angle de vue,
         taille d'une case en pixels, encoches mesurées. Quentin le veut
         hors de l'écran de jeu — « minimaliste, style Waze ».
         Il n'est pas supprimé pour autant : c'est l'instrumentation qui a
         permis de régler le cadrage portrait, et la reconstruire de mémoire
         coûterait cher. Il reparaît avec `?debug=1`, comme le cadre de
         contrôle qu'il accompagne.
    -->
    <div class="bar" id="bar" hidden>
        <span>
            <span id="status">Chargement du plateau…</span>
            <span id="hint">un doigt déplace · deux doigts : pincer zoome, pivoter tourne, glisser incline</span>
            <span id="insets"></span>
        </span>
    </div>

    <!-- Où l'on en est dans le parcours : la vue suivie ne le dit plus
         d'elle-même, contrairement à la vue d'ensemble. -->
    <!-- Les décisions que la règle attend du joueur : distribuer des
         gorgées, renvoyer un bouclier. Sans elles la partie se bloque sans
         que rien ne l'explique. -->
    <div id="actions-panel" hidden></div>

    <!--
         LA BARRE D'ACTION, flottante au-dessus du plateau.
         Elle ne porte plus que des boutons et la ligne qui dit à qui est la
         main. Le journal et la progression vivent maintenant derrière le
         bouton 📜, et le diagnostic a quitté l'écran de jeu : c'est le
         « minimaliste, style Waze » demandé par Quentin.
    -->
    <div class="foot" id="foot">
        <!-- À QUI EST LA MAIN : la seule information qui reste à l'écran en
             permanence. Sans elle, le joueur ne sait plus si c'est son tour,
             et on ne gagne pas de la place en rendant le jeu injouable. -->
        <div id="whose-turn">Au tour de …</div>

        <div class="actions">
            <!-- RECETTE : simule la faveur de Poséidon sans attendre le
                 bon jet. Elle sort sur 2 jets sur 36, après être tombé sur
                 un temple — une faveur sur dix-huit.

                 À RETIRER APRÈS VALIDATION, comme l'a été celui
                 d'Aphrodite. Voir TODO/epic-7-refonte-3d.md. -->
            <button id="test-poseidon" type="button" title="Test : simuler Poséidon" aria-label="Test : simuler Poséidon">🔱 Test</button>
            <button id="test-hermes" type="button" title="Test : simuler Hermès" aria-label="Test : simuler Hermès">👟 Test</button>
            <!-- RELIER UN SECOND APPAREIL (épique 8) : un téléphone devient
                 la manette du plateau, par deux QR codes. -->
            <button id="link-open" type="button" title="Relier un second appareil" aria-label="Relier un second appareil">📱</button>
            <button id="reset" type="button" title="Recadrer la vue" aria-label="Recadrer la vue">🎯</button>
            <button id="whole" type="button" title="Tout le plateau" aria-label="Tout le plateau">🗺️</button>
            <!-- MODE CINÉMA : le lancer se regarde en gros plan, puis la vue
                 revient au plateau. Le choix est rangé d'une partie à
                 l'autre. `aria-pressed` porte l'état : un bouton qui bascule
                 doit dire s'il est enfoncé, sinon il ne s'annonce pas. -->
            <!-- MODE CINÉMA — CACHÉ, pas supprimé (Quentin, 26/10/2026 :
                 « on le laisse mais plus visible », « on le cache pour
                 l'instant »).

                 IL CADRAIT LE DÉ SUR LE PLATEAU, où le dé n'est plus : il
                 ne vit désormais que dans le panneau de droite. Le bouton
                 n'avait donc plus rien à montrer.

                 L'ÉLÉMENT RESTE DANS LA PAGE, et c'est voulu : la scène le
                 retrouve par `getElementById`, et le lancer par SECOUSSE du
                 téléphone n'est branché que dans ce mode
                 (`if (cinema) listenForShakes()`, EPIC-8). Le retirer
                 emporterait la secousse avec lui.

                 POUR LE FAIRE RÉAPPARAÎTRE : supprimer l'attribut `hidden`
                 ci-dessous, et rien d'autre. -->
            <button id="cinema" type="button" aria-pressed="false" title="Mode cinéma" aria-label="Mode cinéma" hidden>🎬</button>
            <button id="roll" class="roll" type="button">Lancer <span id="dice-value">1</span></button>
        </div>
    </div>

    <!--
         L'HISTORIQUE, derrière un bouton.
         Il occupait trois lignes en permanence pour un CONFORT : savoir ce
         qui vient de se passer. On le consulte quand on en a besoin, et le
         plateau récupère la place le reste du temps.
    -->
    <!--
         LES DEUX ONGLETS, sur les bords de l'écran.
         Ils ouvrent ET ferment leur panneau : un seul geste, au même
         endroit, plutôt qu'un bouton pour ouvrir et une croix pour fermer.
         Ils sont posés sur les BORDS parce que c'est de là que coulissent
         les panneaux — le geste part d'où la chose arrive.
    -->
    <button id="journal-open" class="edge-tab edge-left" type="button"
            aria-expanded="false" aria-controls="journal-panel"
            title="Historique de la partie" aria-label="Historique de la partie">📜</button>

    <button id="dice-open" class="edge-tab edge-right" type="button"
            aria-expanded="false" aria-controls="dice-panel"
            title="Panneau des dés" aria-label="Panneau des dés">🎲</button>

    <!--
         LE PANNEAU DES DÉS, à droite.
         Le plateau reste visible à gauche pendant que le dé roule : c'est
         tout l'objet de la demande. Le panneau garde la DERNIÈRE face lue,
         pour qu'on la retrouve en le rouvrant.

         IL EST FERMÉ PAR DÉFAUT : en portrait la largeur est comptée, et un
         panneau permanent amputerait le plateau en continu.
    -->
    <aside id="dice-panel" aria-label="Dés" data-open="false">
        <div id="dice-panel-head">
            <span>Dés</span>
            <button id="dice-panel-close" type="button" aria-label="Fermer le panneau des dés">×</button>
        </div>

        <!-- LA DERNIÈRE FACE LUE. « Aucun lancer » tant que la partie n'a
             pas commencé : un « 1 » affiché d'office se confondrait avec un
             vrai résultat. -->
        <div id="dice-panel-face" aria-live="polite">
            <span id="dice-panel-value">—</span>
            <span id="dice-panel-caption">Aucun lancer</span>
        </div>

        <button id="dice-panel-roll" class="roll" type="button">Lancer le dé</button>
    </aside>

    <div id="journal-panel" data-open="false">
        <div id="journal-card">
            <div id="journal-head">
                <span>Historique</span>
                <button id="journal-close" type="button" aria-label="Fermer l'historique">×</button>
            </div>
            <!-- `#progress` enveloppe la progression : `renderProgress` s'en
                 sert pour la masquer quand le parcours n'a pas de sens, et
                 sans lui elle ne met plus rien à jour du tout. -->
            <div id="progress">
                <div id="progress-label">Case 1 / 23</div>
                <div id="progress-track"><div id="progress-fill"></div></div>
            </div>
            <ul id="journal" aria-live="polite"></ul>
            <div id="turn-log">Lance le dé pour jouer</div>
        </div>
    </div>

    <script type="module" src="/src/features/board/scene3d/preview.ts"></script>
</body>
</html>
