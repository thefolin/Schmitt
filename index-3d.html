<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Schmitt Odyssée — aperçu 3D</title>
    <style>
        /* Aperçu volontairement dépouillé : il sert à juger le PLATEAU,
           son cadrage et sa lisibilité. Le HUD du jeu viendra plus tard. */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Les encoches système, reportées dans des variables pour que la
           recette puisse en simuler sur un navigateur de bureau, où
           env(safe-area-inset-*) vaut toujours zéro. */
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #0d1524;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: #e8edf9;
        }

        /* Le canvas occupe tout l'écran ; le bandeau se superpose, comme le
           fera le vrai HUD. */
        #scene {
            position: fixed;
            inset: 0;
            touch-action: none;
            cursor: grab;
        }

        #scene:active { cursor: grabbing; }
        #scene canvas { display: block; }

        .bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            padding-top: calc(12px + var(--safe-top));
            background: rgba(13, 21, 36, 0.82);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Ce que le cadrage a mesuré : évite de refaire la soustraction de
           tête en lisant une capture d'écran. */
        #insets {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            color: #7d8aa6;
        }

        /* Le cadre de contrôle : le plateau doit être centré DANS LUI. */
        #frame { display: none; }

        .debug-outline #frame {
            display: block;
            position: fixed;
            left: 0;
            right: 0;
            z-index: 5;
            pointer-events: none;
            border: 1px dashed rgba(212, 175, 55, 0.55);
        }

        .debug-outline #frame::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            border-top: 1px dashed rgba(212, 175, 55, 0.35);
        }

        #status {
            display: block;
            font-size: 13px;
            line-height: 1.3;
            color: #aab6d0;
        }

        /* Le geste ne se devine pas : on le dit une fois, discrètement. */
        #hint {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            color: #6b7896;
        }

        button {
            flex: 0 0 auto;
            min-height: 40px;
            padding: 0 14px;
            font: inherit;
            font-size: 13px;
            color: #e8edf9;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            cursor: pointer;
        }

        button:hover { border-color: #d4af37; }

        /* Un CONSEIL, pas un mur. La première version couvrait tout l'écran
           avec un fond opaque : le plateau était dessiné derrière mais
           totalement inatteignable, et le joueur ne pouvait plus jouer du
           tout. Le message se pose maintenant en bandeau, laisse voir le
           plateau, et surtout `pointer-events: none` laisse passer les
           gestes — on peut jouer en portrait si on y tient. */
        #rotate-hint {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(96px + var(--safe-bottom));
            z-index: 40;
            pointer-events: none;
            max-width: min(320px, calc(100% - 32px));
        }

        .rotate-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            text-align: left;
            border-radius: 14px;
            background: rgba(13, 21, 36, 0.92);
            border: 1px solid rgba(212, 175, 55, 0.35);
            backdrop-filter: blur(8px);
        }

        .rotate-text { display: flex; flex-direction: column; }
        .rotate-card strong { font-size: 14px; }
        .rotate-card span { font-size: 12px; color: #aab6d0; }

        .rotate-icon {
            flex: 0 0 auto;
            font-size: 26px;
            /* Le pictogramme bascule : il montre le geste attendu plutôt que
               de seulement le nommer. */
            animation: tilt 2.4s ease-in-out infinite;
        }

        @keyframes tilt {
            0%, 40% { transform: rotate(0deg); }
            60%, 100% { transform: rotate(-90deg); }
        }

        /* Le mouvement peut gêner : on le retire quand le système le demande. */
        @media (prefers-reduced-motion: reduce) {
            .rotate-icon { animation: none; transform: rotate(-90deg); }
        }

        /* La barre du bas : elle situe le joueur sans manger l'écran. */
        .foot {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            padding-bottom: calc(10px + var(--safe-bottom));
            background: rgba(13, 21, 36, 0.82);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        #progress { flex: 1 1 auto; min-width: 0; }

        #whose-turn {
            font-size: 13px;
            font-weight: 600;
            color: #e8edf9;
        }

        /* Ce que le dernier tour a produit : c'est ce qu'on vérifie à l'œil,
           face du dé contre nombre de cases parcourues. */
        #turn-log {
            margin: 2px 0 4px;
            font-size: 12px;
            color: #d4af37;
        }

        #progress-label {
            margin-bottom: 5px;
            font-size: 11px;
            color: #7d8aa6;
        }

        #progress-track {
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            width: 0;
            border-radius: 999px;
            background: #d4af37;
            transition: width 0.18s ease-out;
        }

        .actions {
            flex: 0 0 auto;
            display: flex;
            gap: 8px;
        }

        /* Les cibles tactiles font 48px : c'est le seuil qu'on impose aussi
           aux cases du plateau. */
        #prev, #next {
            min-width: 48px;
            min-height: 48px;
            font-size: 20px;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div id="scene"></div>

    <!-- Le jeu se joue en paysage. Plutôt que de verrouiller l'orientation,
         on le dit : le joueur garde la main, et on pourra verrouiller plus
         tard si l'usage montre que c'est nécessaire. -->
    <div id="rotate-hint" hidden>
        <div class="rotate-card">
            <div class="rotate-icon">📱</div>
            <div class="rotate-text">
                <strong>Tourne ton téléphone</strong>
                <span>Le jeu est plus lisible à l'horizontale.</span>
            </div>
        </div>
    </div>

    <!-- Cadre de contrôle, visible avec ?debug=1 : le plateau doit être
         centré dans lui, et sa ligne médiane passer au milieu du plateau. -->
    <div id="frame"></div>

    <div class="bar" id="bar">
        <span>
            <span id="status">Chargement du plateau…</span>
            <span id="hint">glisser pour tourner · clic droit pour déplacer · molette pour zoomer</span>
            <span id="insets"></span>
        </span>
        <button id="reset" type="button">Recadrer</button>
    </div>

    <!-- Où l'on en est dans le parcours : la vue suivie ne le dit plus
         d'elle-même, contrairement à la vue d'ensemble. -->
    <div class="foot" id="foot">
        <div id="progress">
            <div id="whose-turn">Au tour de Alice</div>
            <div id="turn-log">Lance le dé pour jouer</div>
            <div id="progress-label">Case 1 / 23</div>
            <div id="progress-track"><div id="progress-fill"></div></div>
        </div>
        <div class="actions">
            <button id="whole" type="button">Tout le plateau</button>
            <button id="roll" type="button">Lancer <span id="dice-value">1</span></button>
        </div>
    </div>

    <script type="module" src="/src/features/board/scene3d/preview.ts"></script>
</body>
</html>
